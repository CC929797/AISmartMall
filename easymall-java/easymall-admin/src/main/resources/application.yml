server:
  port: 6061
  servlet:
    context-path: /api
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/easymall2?allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: ${PROJECT_FOLDER:./runtime/files/}
admin:
  account: ${ADMIN_ACCOUNT:}
  password-hash: ${ADMIN_PASSWORD_HASH:}
#日志级别
log:
  root:
    level: info
# 物流模式
logistics:
  mode: ${LOGISTICS_MODE:disabled}
