server:
  port: 8084
spring:
  main:
    web-application-type: reactive
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/easymall?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  ai:
    # MCP 服务
    mcp:
      server:
        protocol: STREAMABLE # STREAMABLE STATELESS
        name: easymall-mcp  # 服务器名称
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /mcp  #默认是mcp
          keep-alive-interval: 60s
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: ${PROJECT_FOLDER:./runtime/files/}
  auto-checkpay: false #自动检查支付订单
#支付宝
alipay:
  appid: ${ALIPAY_APP_ID:}   # 沙箱
  appPrivateKey: ${ALIPAY_PRIVATE_KEY:}
  appCertPath: ${ALIPAY_APP_CERT_PATH:}
  alipayPublicCertPath: ${ALIPAY_PUBLIC_CERT_PATH:}
  alipayRootCertPath: ${ALIPAY_ROOT_CERT_PATH:}
  serverUrl: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}