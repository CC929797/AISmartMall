server:
  port: 6050
  servlet:
    context-path: /api
ws:
  port: 6051
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/easymall?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  codec:
    default-charset: UTF-8
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password
  # AI相关
  ai:
    #向量数据库
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: easymall-index-vectorstore
        dimensions: 1024 #embeddinggemma:768  百炼 text-embedding-v4:1024  doubao-embedding-vision-251215:2048# 向量维度（根据使用的嵌入模型调整）
    # 使用openai 对接 阿里百炼(推荐大家使用这个,下面的otherai可以不用管,如果没有阿里百炼的,可以使用deepseek的chat模型(deepssek没向量模型)),豆包的向量模型)
    openai:
      api-key: ${AI_API_KEY:}
      #base-url: https://dashscope.aliyuncs.com/compatible-mode/
      base-url: ${AI_BASE_URL:http://127.0.0.1:1}
      chat:
        completions-path: ${AI_CHAT_PATH:/v1/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:unconfigured}  #qwen3-max 使用max 调用mcp 报错toolName cannot be null
      embedding:
        embeddings-path: ${AI_EMBEDDING_PATH:/v1/embeddings}
        options:
          model: ${AI_EMBEDDING_MODEL:unconfigured}
    dashscope:
      base-url: ${AI_BASE_URL:http://127.0.0.1:1}
      api-key: ${AI_API_KEY:}
      embedding:
        model: ${AI_EMBEDDING_MODEL:unconfigured}

#    mcp:
#      client:
#        enabled: true
#        name: my-mcp-client
#        version: 1.0.0
#        request-timeout: 30s
#        type: sync
#        streamable-http:
#          connections:
#            mcp-server:
#              url: http://127.0.0.1:8084

mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: ${PROJECT_FOLDER:./runtime/files/}
  auto-checkpay: false #自动检查支付订单
  domain: ${PROJECT_DOMAIN:http://127.0.0.1:6001}

#订单过期时间
order:
  expire:
    minute: 10
  confirm:
    minute: 15 #订单物流自动确认时间
#支付宝
alipay:
  # 本地不配置公网通知地址时使用主动查单；不要填写xxx.xxxx.com之类的占位域名。
  notify-url: ${ALIPAY_NOTIFY_URL:}
  seller-id: ${ALIPAY_SELLER_ID:}
  appid: ${ALIPAY_APP_ID:}   # 沙箱
  appPrivateKey: ${ALIPAY_PRIVATE_KEY:}
  appCertPath: ${ALIPAY_APP_CERT_PATH:}
  alipayPublicCertPath: ${ALIPAY_PUBLIC_CERT_PATH:}
  alipayRootCertPath: ${ALIPAY_ROOT_CERT_PATH:}
  serverUrl: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
#日志级别
log:
  root:
    level: info
# 物流模式
logistics:
  mode: ${LOGISTICS_MODE:disabled}
