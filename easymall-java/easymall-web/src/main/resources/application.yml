server:
  port: 6050
  servlet:
    context-path: /api
ws:
  port: 6051
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/xxx?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: xxx
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  codec:
    default-charset: UTF-8
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: D:/java/java24/wokspach-teach/runtime/easymall/
  auto-checkpay: true #自动检查支付订单
  domain: http://xxx.xxxx.com
#订单过期时间
order:
  expire:
    minute: 10
#支付宝
alipay:
  appid: xxxx   # 沙箱
  appPrivateKey: xxx
  appCertPath: xxx
  alipayPublicCertPath: xxx
  alipayRootCertPath: xxx
  serverUrl: xxx
#日志级别
log:
  root:
    level: debug