# Copy to admin.yml and select explicitly with --spring.config.location.
server:
  address: 127.0.0.1
  port: 6061
  servlet:
    context-path: /api
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/easymall_test?useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:19200}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
project:
  folder: ${PROJECT_FOLDER:./target/local-files/}
  auto-checkpay: false
admin:
  account: ${ADMIN_ACCOUNT}
  password: ${ADMIN_PASSWORD}
logging:
  level:
    root: INFO
log:
  root:
    level: info

# 图片校验的硬上限不可通过配置放大；以下值可以按演示需要收紧。
security:
  images:
    max-bytes: 5242880
    max-dimension: 4096
    max-pixels: 12000000
    requests-per-minute: 20
    daily-bytes: 104857600
  logging:
    model-summary: false
payment:
  mode: ${PAYMENT_MODE:sandbox}
logistics:
  mode: ${LOGISTICS_MODE:disabled}
